name: DijitalCiftlikGunlugum
options:
  bundleIdPrefix: com.ciftlikgunlugu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  DijitalCiftlikGunlugum:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "README.md"
          - "project.yml"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ciftlikgunlugu.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Tarla notlarına ses kaydı eklemek için mikrofon kullanılır."
        INFOPLIST_KEY_NSCameraUsageDescription: "Tarla fotoğrafı çekmek için kamera kullanılır."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Galeriden fotoğraf eklemek için fotoğraf erişimi kullanılır."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
